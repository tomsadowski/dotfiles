set -g mouse on
set-option -g set-clipboard on
set -g allow-passthrough on
set -as terminal-features ',xterm*:clipboard'

set -ga terminal-overrides ",*:RGB"
set -g status-style "bg=#202022,fg=#707688"
set -g pane-border-style "fg=#747890"
set -g pane-active-border-style "fg=#b8c0c8"
setw -g window-status-current-style "bg=#2a2c32,fg=#b8c0c8"


# Use Alt+Arrow keys to switch panes directly, no prefix required
#bind -n M-Left select-pane -L
#bind -n M-Right select-pane -R
#bind -n M-Up select-pane -U
#bind -n M-Down select-pane -D


# Switch windows with Alt+Left/Right (no prefix needed)
bind -n M-Left previous-window
bind -n M-Right next-window
